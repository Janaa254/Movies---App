name: movies_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: any

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  dio: ^5.11.0
  http: ^1.5.0

  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2

  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/
    - assets/avatars/
    - assets/avatars/marvel/
    - assets/avatars/disney/
    - assets/avatars/harry_potter/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/logo_foreground.png"

  adaptive_icon_background: "#0B0D0C"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"

  min_sdk_android: 21